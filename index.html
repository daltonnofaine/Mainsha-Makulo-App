<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0fb9b1" />
  <title>Mainsha Makulu English — Aprenda inglês brincando</title>
  <meta name="description" content="App gratuito da comunidade Mainsha Makulu para aprender inglês de forma divertida em Pemba." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar" id="topbar"></header>

  <main id="app" class="app"></main>

  <nav class="navbar" id="navbar">
    <button class="navbtn active" data-view="path" aria-label="Aprender">
      <span class="navicon">🏠</span>
      <span>Aprender</span>
    </button>
    <button class="navbtn" data-view="league" aria-label="Liga semanal">
      <span class="navicon">🏆</span>
      <span>Liga</span>
    </button>
    <button class="navbtn" data-view="profile" aria-label="Perfil">
      <span class="navicon">📊</span>
      <span>Perfil</span>
    </button>
  </nav>

  <section id="lesson" class="lesson hidden" aria-label="Lição"></section>
  <section id="modal" class="modal-backdrop hidden" aria-label="Janela"></section>
  <div id="toast" class="toast hidden" role="status"></div>
  <div id="confetti" class="confetti-layer"></div>

  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
